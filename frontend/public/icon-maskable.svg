<?xml version="1.0" encoding="UTF-8"?>
<!-- datathink app icon (maskable) — Forest & Ink.
     Full-bleed forest-ink ground (no corner rounding — iOS/Android apply
     their own mask). Mark sits inside the central ~60% maskable safe zone.
     Source of truth for apple-touch-icon.png (180), icon-192.png, icon-512.png. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="datathink">
  <rect width="512" height="512" fill="#0D1A10"/>
  <g transform="translate(119.5,74) scale(7)">
    <rect x="2" y="22" width="26" height="26" rx="6" fill="#4ADE80"/>
    <rect x="22" y="4" width="15" height="15" rx="4" fill="#87B09A"/>
  </g>
</svg>
