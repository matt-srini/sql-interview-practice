<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>datathink — Color Theme Picker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #111;
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Picker chrome ── */
  .picker-header {
    padding: 14px 24px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .picker-header h1 { font-size: 13px; font-weight: 600; color: #bbb; letter-spacing: 0.04em; text-transform: uppercase; }
  .picker-header span { font-size: 12px; color: #555; }

  .picker-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Palette rail ── */
  .palette-rail {
    width: 220px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid #222;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .palette-rail::-webkit-scrollbar { width: 4px; }
  .palette-rail::-webkit-scrollbar-track { background: transparent; }
  .palette-rail::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  .palette-btn {
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    background: #1a1a1a;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }
  .palette-btn:hover { background: #222; }
  .palette-btn.active { border-color: #555; background: #222; }

  .palette-btn-name {
    font-size: 12px;
    font-weight: 600;
    color: #ccc;
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  .palette-btn-sub {
    font-size: 10px;
    color: #555;
    margin-bottom: 8px;
  }
  .swatch-row {
    display: flex;
    gap: 4px;
  }
  .swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* ── Preview pane ── */
  .preview-pane {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 24px;
    background: #0d0d0d;
  }

  .preview-frame {
    width: 100%;
    max-width: 900px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  /* ── Simulated site UI ── */
  .sim-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 52px;
    border-bottom: 1px solid var(--sim-border);
    background: var(--sim-bg);
  }
  .sim-logo {
    font-size: 14px;
    font-weight: 700;
    color: var(--sim-text-strong);
    letter-spacing: -0.01em;
  }
  .sim-logo-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--sim-accent);
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
    margin-bottom: 1px;
  }
  .sim-nav { display: flex; gap: 20px; align-items: center; }
  .sim-nav-link { font-size: 13px; color: var(--sim-text-secondary); text-decoration: none; }
  .sim-nav-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 8px;
    border: none;
    background: var(--sim-accent);
    color: var(--sim-btn-fg, #fff);
    cursor: pointer;
  }

  .sim-body { background: var(--sim-bg); }

  /* Hero */
  .sim-hero {
    padding: 52px 28px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: center;
  }
  .sim-eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sim-accent);
    margin-bottom: 12px;
    font-family: 'Courier New', monospace;
  }
  .sim-h1 {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.03em;
    color: var(--sim-text-strong);
    margin-bottom: 14px;
  }
  .sim-copy { font-size: 13px; line-height: 1.6; color: var(--sim-text-secondary); margin-bottom: 20px; }
  .sim-ctas { display: flex; gap: 10px; }
  .sim-cta-primary {
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    background: var(--sim-accent);
    color: var(--sim-btn-fg, #fff);
    border: none;
    cursor: pointer;
  }
  .sim-cta-secondary {
    font-size: 13px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 8px;
    background: transparent;
    color: var(--sim-text-secondary);
    border: 1.5px solid var(--sim-border);
    cursor: pointer;
  }

  /* IDE mock */
  .sim-ide {
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.07);
    font-family: 'Courier New', monospace;
    font-size: 11px;
  }
  .sim-ide-chrome {
    background: var(--sim-editor-chrome);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .sim-ide-dot { width: 8px; height: 8px; border-radius: 50%; }
  .sim-ide-file { font-size: 10px; color: rgba(255,255,255,0.35); margin-left: 6px; }
  .sim-ide-badge {
    margin-left: auto;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--sim-accent);
    color: #fff;
    font-weight: 600;
  }
  .sim-ide-code {
    background: var(--sim-editor-bg);
    padding: 14px 16px;
    line-height: 1.7;
  }
  .sim-kw { color: #c792ea; }
  .sim-fn { color: #82aaff; }
  .sim-str { color: #c3e88d; }
  .sim-cm { color: rgba(255,255,255,0.25); }

  /* Tracks strip */
  .sim-tracks {
    padding: 20px 28px 28px;
    border-top: 1px solid var(--sim-border);
  }
  .sim-tracks-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sim-text-secondary);
    margin-bottom: 12px;
  }
  .sim-track-list { display: flex; flex-direction: column; gap: 8px; }
  .sim-track-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--sim-surface);
    border-radius: 8px;
    border: 1px solid var(--sim-border);
  }
  .sim-track-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sim-track-name { font-size: 13px; font-weight: 600; color: var(--sim-text-strong); flex: 1; }
  .sim-track-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--sim-bg);
    color: var(--sim-text-secondary);
    border: 1px solid var(--sim-border);
    font-family: 'Courier New', monospace;
  }
  .sim-track-enter { font-size: 12px; color: var(--sim-accent); font-weight: 600; }

  /* Status chips */
  .sim-chips { display: flex; gap: 6px; padding: 0 28px 20px; }
  .sim-chip {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 5px;
  }
  .sim-chip-success { background: var(--sim-success-bg); color: var(--sim-success); }
  .sim-chip-warn { background: var(--sim-warn-bg); color: var(--sim-warn); }
  .sim-chip-danger { background: var(--sim-danger-bg); color: var(--sim-danger); }

  /* Palette label banner */
  .preview-label {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #444;
    letter-spacing: 0.04em;
  }

  /* ── Mode toggle ── */
  .mode-toggle { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .mode-toggle-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 7px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #bbb;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 0.01em;
    font-family: inherit;
  }
  .mode-toggle-btn:hover { background: #252525; border-color: #444; }
  .mode-toggle-btn.dark-active { background: #222; border-color: #555; color: #ddd; }
  .mode-icon { font-size: 13px; line-height: 1; }

  /* ── Color token grid ── */
  .sim-color-grid {
    padding: 16px 28px 22px;
    border-top: 1px solid var(--sim-border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .sim-color-grid-label {
    width: 100%;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sim-text-secondary);
    margin-bottom: 2px;
    font-family: 'Courier New', monospace;
  }
  .sim-color-swatch { display: flex; flex-direction: column; gap: 3px; }
  .sim-color-block {
    width: 56px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid rgba(128,128,128,0.2);
  }
  .sim-color-token-name {
    font-size: 8px;
    font-weight: 700;
    color: var(--sim-text-strong);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: 'Courier New', monospace;
  }
  .sim-color-hex {
    font-size: 8px;
    color: var(--sim-text-secondary);
    font-family: 'Courier New', monospace;
  }

</style>
</head>
<body>

<div class="picker-header">
  <h1>datathink — Theme Picker</h1>
  <span>Click a palette to preview · Tell Claude which one you want</span>
  <div class="mode-toggle">
    <button class="mode-toggle-btn" id="mode-toggle-btn" onclick="toggleMode()">

    </button>
  </div>
</div>

<div class="picker-body">

    <div style="width:100%;max-width:900px;">
      <div class="preview-frame" id="preview">
        <!-- injected by JS -->
      </div>
      <div class="preview-label" id="preview-label"></div>

</div>

function renderPreview(p, mode) {

function renderRail() {
  const rail = document.getElementById('rail');
  PALETTES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'palette-btn' + (i === 0 ? ' active' : '');
    btn.dataset.id = p.id;
    const lightSwatches = [p.lightVars['--sim-bg'], p.lightVars['--sim-surface'], p.lightVars['--sim-accent'], p.lightVars['--sim-text-strong']];
    const darkSwatches  = [p.darkVars['--sim-bg'],  p.darkVars['--sim-surface'],  p.darkVars['--sim-accent'],  p.darkVars['--sim-text-strong']];
    btn.innerHTML = `
      <div class="palette-btn-name">${p.name}</div>
      <div class="palette-btn-sub">${p.sub}</div>
      <div class="swatch-row" style="margin-bottom:3px">
        ${lightSwatches.map(c => `<div class="swatch" style="background:${c}" title="${c}"></div>`).join('')}
      </div>
      <div class="swatch-row">
        ${darkSwatches.map(c => `<div class="swatch" style="background:${c}" title="${c}"></div>`).join('')}
      </div>
    `;
    btn.addEventListener('click', () => selectPalette(p.id));
    rail.appendChild(btn);
  });
}

function updatePreviewLabel(p) {
  document.getElementById('preview-label').textContent =
    `"${p.name}" — ${p.sub} · ${currentMode === 'dark' ? 'Dark' : 'Light'} mode`;
}

function selectPalette(id) {
  currentPaletteId = id;
  const p = PALETTES.find(x => x.id === id);
  if (!p) return;
  document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-id="${id}"]`).classList.add('active');
  document.getElementById('preview').innerHTML = renderPreview(p, currentMode);
  updatePreviewLabel(p);
}

function toggleMode() {
  currentMode = currentMode === 'light' ? 'dark' : 'light';
  const btn = document.getElementById('mode-toggle-btn');
  if (currentMode === 'dark') {
    btn.innerHTML = '<span class="mode-icon">🌙</span> Dark';
    btn.classList.add('dark-active');
  } else {
    btn.innerHTML = '<span class="mode-icon">☀️</span> Light';
    btn.classList.remove('dark-active');
  }
  const p = PALETTES.find(x => x.id === currentPaletteId);
  if (p) {
    document.getElementById('preview').innerHTML = renderPreview(p, currentMode);
    updatePreviewLabel(p);
  }
}

renderRail();
selectPalette('warm-ivory');
