<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="datathink — SQL, Python &amp; Data Interview Practice">
  <!-- Background -->
  <rect width="1200" height="630" fill="#141413"/>

  <!-- Subtle grid accent -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#F0EEE9" stroke-opacity="0.04"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#F0EEE9" stroke-opacity="0.04"/>
  <line x1="1" y1="0" x2="1" y2="630" stroke="#F0EEE9" stroke-opacity="0.04"/>
  <line x1="1199" y1="0" x2="1199" y2="630" stroke="#F0EEE9" stroke-opacity="0.04"/>

  <!--
    Layout maths (all y values in og-image px):
      Logo group translate-x=41 → monogram left edge = 41 + 25.08×1.65 ≈ 82  (matches tagline x)
      Blue bar top  = 162 + 41.08×1.65 ≈ 230
      Stats bottom  = 397 + ~4 descender ≈ 401
      Content height ≈ 171 px  →  centred: top=230, bottom=401, margins ≈ 229/229
  -->

  <!-- Logo: exact lockup-bar-reverse-no-bg structure, scaled 1.65× -->
  <g transform="translate(41, 162) scale(1.65)">
    <g transform="translate(0,16) scale(0.66)">
      <g transform="translate(12,0)">
        <g transform="translate(18,32)">
          <path d="M8 72 V16 H30 A14 14 0 0 1 30 44 H8 Z" fill="#FFFFFF"/>
          <rect x="8" y="6" width="32" height="6" rx="3" fill="#5B6AF0"/>
        </g>
      </g>
    </g>
    <g transform="translate(50,32)">
      <text x="6" y="34" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5" fill="#FFFFFF">datathink</text>
    </g>
  </g>

  <!-- Tagline — left edge x=82 aligns with monogram -->
  <text x="82" y="327" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="22" fill="#A09C96">SQL · Python · Pandas · PySpark Interview Practice</text>

  <!-- Divider -->
  <rect x="82" y="362" width="320" height="1" fill="#F0EEE9" fill-opacity="0.12"/>

  <!-- Stats row -->
  <text x="82" y="397" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="500" font-size="18" fill="#F0EEE9" fill-opacity="0.55">350+ questions  ·  22 learning paths  ·  instant feedback</text>
</svg>
