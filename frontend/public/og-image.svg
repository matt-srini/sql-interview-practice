<?xml version="1.0" encoding="UTF-8"?>
<!-- datathink Open Graph cover — Forest & Ink (1200×630).
     Canonical two-diagonal-squares mark + data/think wordmark on the
     deep forest-ink ground. Durable copy: "9 tracks · 850+ curated
     questions · 1,000+ mock-exclusive" — round counts that signal
     curation + the premium bank without the per-release drift that
     staled the previous "350+ / 22".
     Source of truth for og-image.png — re-render via scripts/render-brand-assets.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="datathink — develop the reasoning that makes you effective with data">
  <!-- Forest-ink background -->
  <rect width="1200" height="630" fill="#0D1A10"/>

  <!-- Subtle hairline frame -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#E8F5E9" stroke-opacity="0.05"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#E8F5E9" stroke-opacity="0.05"/>
  <line x1="1" y1="0" x2="1" y2="630" stroke="#E8F5E9" stroke-opacity="0.05"/>
  <line x1="1199" y1="0" x2="1199" y2="630" stroke="#E8F5E9" stroke-opacity="0.05"/>

  <!-- Lockup: two-diagonal-squares mark (×2.6) + wordmark -->
  <g transform="translate(96,178) scale(2.6)">
    <rect x="2" y="22" width="26" height="26" rx="6" fill="#4ADE80"/>
    <rect x="22" y="4" width="15" height="15" rx="4" fill="#87B09A"/>
  </g>
  <text x="220" y="268" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="64" letter-spacing="-1.5">
    <tspan font-weight="300" fill="#87B09A">data</tspan><tspan font-weight="700" fill="#E8F5E9">think</tspan>
  </text>

  <!-- Tagline — aligned to mark left edge (x≈101) -->
  <text x="101" y="362" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="30" fill="#A8BDB4">Develop the reasoning that makes you effective with data.</text>

  <!-- Divider -->
  <rect x="101" y="400" width="360" height="1" fill="#E8F5E9" fill-opacity="0.14"/>

  <!-- Stat row — durable counts; signals curation + the mock-exclusive bank -->
  <text x="101" y="440" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="22" fill="#87B09A">9 tracks&#160;&#160;·&#160;&#160;850+ curated questions&#160;&#160;·&#160;&#160;1,000+ mock-exclusive</text>
</svg>
