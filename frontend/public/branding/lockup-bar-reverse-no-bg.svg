<?xml version="1.0" encoding="UTF-8"?>
<!-- Combined lockup: monogram (white D with blue bar) + white wordmark — no background -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="120" viewBox="0 0 456 120" role="img" aria-labelledby="title desc">
  <title id="title">datathink lockup — bar reverse</title>
  <desc id="desc">Monogram with a horizontal bar accent and white wordmark on transparent background for dark surfaces.</desc>

  <!-- Monogram (left) - kept to the same scale and placement as the bar lockup -->
  <g id="monogram" transform="translate(0,16) scale(0.66)">
    <g transform="translate(12,0)">
      <g transform="translate(18,32)">
        <path d="M8 72 V16 H30 A14 14 0 0 1 30 44 H8 Z" fill="#FFFFFF"/>
        <rect x="8" y="6" width="32" height="6" rx="3" fill="#5B6AF0"/>
      </g>
    </g>
  </g>

  <!-- Wordmark (right) - same styling as the reverse lockup -->
  <g id="wordmark" transform="translate(50,32)">
    <text x="6" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5" fill="#FFFFFF">datathink</text>
  </g>

</svg>