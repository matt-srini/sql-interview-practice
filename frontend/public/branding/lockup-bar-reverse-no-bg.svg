<?xml version="1.0" encoding="UTF-8"?>
<!-- datathink lockup — Forest & Ink dark theme
     Mark: two diagonal rounded squares (thought-bubble motif) -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" role="img" aria-label="datathink">
  <!-- Big block (bottom-left) -->
  <rect x="2" y="22" width="26" height="26" rx="6" fill="#43D27C"/>
  <!-- Small block (top-right, diagonal) -->
  <rect x="22" y="4" width="15" height="15" rx="4" fill="#87B09A"/>
  <!-- Wordmark -->
  <text x="46" y="38" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="-0.4">
    <tspan font-weight="300" fill="#87B09A">data</tspan><tspan font-weight="700" fill="#E8F5E9">think</tspan>
  </text>
</svg>
