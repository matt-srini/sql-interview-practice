<?xml version="1.0" encoding="UTF-8"?>
<!-- Combined lockup: monogram (bar D) + accent wordmark — no background -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="120" viewBox="0 0 456 120" role="img" aria-labelledby="title desc">
  <title id="title">datathink lockup — bar</title>
  <desc id="desc">Monogram with a horizontal bar accent and the accent wordmark on a transparent background.</desc>

  <!-- Monogram (left) - reduced to sit closer to the wordmark -->
  <g id="monogram" transform="translate(0,16) scale(0.66)">
    <g transform="translate(12,0)">
      <g transform="translate(18,32)">
        <path d="M8 72 V16 H30 A14 14 0 0 1 30 44 H8 Z" fill="#5B6AF0"/>
        <rect x="8" y="6" width="32" height="6" rx="3" fill="#807e7c"/>
      </g>
    </g>
  </g>

  <!-- Wordmark (right) - same styling as the normal lockup -->
  <g id="wordmark" transform="translate(48,32)">
    <text x="6" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5" fill="#5B6AF0">datathink</text>
  </g>

</svg>