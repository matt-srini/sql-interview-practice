<?xml version="1.0" encoding="UTF-8"?>
<!-- datathink Open Graph cover — Forest & Ink LIGHT variant (1200×630).
     A light-ground alternate of og-image.svg for light-background
     placements (emails, docs, press). NOT the canonical share card —
     og:image stays the dark og-image.png; share platforms can't switch
     by viewer theme. Source of truth for og-image-light.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="datathink — develop the reasoning that makes you effective with data">
  <!-- Light page ground -->
  <rect width="1200" height="630" fill="#F5F7F4"/>

  <!-- Subtle hairline frame -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#14291B" stroke-opacity="0.06"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#14291B" stroke-opacity="0.06"/>
  <line x1="1" y1="0" x2="1" y2="630" stroke="#14291B" stroke-opacity="0.06"/>
  <line x1="1199" y1="0" x2="1199" y2="630" stroke="#14291B" stroke-opacity="0.06"/>

  <!-- Lockup: two-diagonal-squares mark (×2.6) + wordmark -->
  <g transform="translate(96,178) scale(2.6)">
    <rect x="2" y="22" width="26" height="26" rx="6" fill="#166534"/>
    <rect x="22" y="4" width="15" height="15" rx="4" fill="#4B6858"/>
  </g>
  <text x="220" y="268" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="64" letter-spacing="-1.5">
    <tspan font-weight="300" fill="#4B6858">data</tspan><tspan font-weight="700" fill="#14291B">think</tspan>
  </text>

  <!-- Tagline — aligned to mark left edge (x≈101) -->
  <text x="101" y="362" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="30" fill="#4B6858">Develop the reasoning that makes you effective with data.</text>

  <!-- Divider -->
  <rect x="101" y="400" width="360" height="1" fill="#14291B" fill-opacity="0.14"/>

  <!-- Stat row — durable counts; signals curation + the mock-exclusive bank -->
  <text x="101" y="440" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="22" fill="#4B6858">10 tracks&#160;&#160;·&#160;&#160;850+ curated questions&#160;&#160;·&#160;&#160;1,000+ mock-exclusive</text>
</svg>
