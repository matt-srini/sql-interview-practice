<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}" />
  <link rel="canonical" href="{{ canonical_url }}" />
  <!-- Open Graph -->
  <meta property="og:title" content="{{ page_title }}" />
  <meta property="og:description" content="{{ page_description }}" />
  <meta property="og:url" content="{{ canonical_url }}" />
  <meta property="og:type" content="{{ og_type }}" />
  <meta property="og:image" content="{{ og_image }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page_title }}" />
  <meta name="twitter:description" content="{{ page_description }}" />
  <meta name="twitter:image" content="{{ og_image }}" />
  {% block head_extra %}{% endblock %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest-700: #2d6a4f;
      --forest-600: #3a7a5c;
      --forest-100: #eaf4ee;
      --ink-900: #1a1a2e;
      --ink-600: #4a4a6a;
      --ink-400: #7a7a9a;
      --border: #e0e7e4;
      --white: #ffffff;
      --radius: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      color: var(--ink-900);
      background: var(--white);
      line-height: 1.6;
    }
    a { color: var(--forest-700); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
    }
    .site-header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
    }
    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--forest-700);
      letter-spacing: -0.02em;
    }
    .site-nav { display: flex; gap: 1.5rem; margin-left: auto; }
    .site-nav a { font-size: 0.9rem; color: var(--ink-600); }

    .page-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .site-footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-400);
    }

    /* Article prose */
    .prose h1 { font-size: 2rem; font-weight: 700; line-height: 1.25; margin-bottom: 0.75rem; color: var(--ink-900); }
    .prose h2 { font-size: 1.35rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.5rem; color: var(--ink-900); }
    .prose h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.4rem; }
    .prose p { margin-bottom: 1rem; color: var(--ink-600); }
    .prose ul, .prose ol { margin-bottom: 1rem; padding-left: 1.5rem; color: var(--ink-600); }
    .prose li { margin-bottom: 0.25rem; }
    .prose code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875em;
      background: var(--forest-100);
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }
    .prose pre {
      background: #1e2330;
      color: #e2e8f0;
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      overflow-x: auto;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      line-height: 1.55;
    }
    .prose pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .prose a { color: var(--forest-700); font-weight: 500; }
    .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.9rem; }
    .prose th, .prose td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
    .prose th { background: var(--forest-100); font-weight: 600; }

    /* Guide index */
    .guide-list { list-style: none; display: flex; flex-direction: column; gap: 1.5rem; margin-top: 1.5rem; }
    .guide-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      transition: box-shadow 0.15s;
    }
    .guide-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .guide-card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
    .guide-card h2 a { color: var(--ink-900); }
    .guide-card p { font-size: 0.9rem; color: var(--ink-600); margin-bottom: 0; }
    .guide-date { font-size: 0.8rem; color: var(--ink-400); margin-top: 0.5rem; display: block; }

    /* Breadcrumb */
    .breadcrumb { display: flex; gap: 0.4rem; align-items: center; font-size: 0.85rem; color: var(--ink-400); margin-bottom: 1.5rem; }
    .breadcrumb a { color: var(--ink-400); }
    .breadcrumb span { color: var(--ink-400); }

    /* Article meta */
    .article-meta { font-size: 0.85rem; color: var(--ink-400); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand">datathink</a>
      <nav class="site-nav">
        <a href="/sample">Free sample</a>
        <a href="/pricing">Pricing</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    &copy; datathink · data interview practice
  </footer>
</body>
</html>
